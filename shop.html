<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src https://cdnjs.cloudflare.com; img-src 'self' data:; media-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Visit Plugged by Shayo - Stanbank Building (next to Archives, CBD), Shop 19, 3rd Floor, Nairobi. Unique style for your feet and fits.">
    <title>Shop Tour | Plugged by Shayo</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #172033;
            background-image: url('background_image.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        @media (max-width: 768px) {
            body { background-size: 100% auto; background-position: top center; background-attachment: scroll; }
        }

        header {
            background: linear-gradient(135deg, #1e40af 0%, #0ea5e9 100%);
            color: #fff;
            text-align: center;
            padding: 12px 16px;
            box-shadow: 0 2px 10px rgba(0,0,0,.1);
        }
        header h1 { font-size: 1.9em; line-height: 1.15; }
        @media (max-width: 600px) { header h1 { font-size: 1.45em; } }

        nav {
            background: #1e40af;
            padding: 7px 8px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            overflow-x: auto;
            white-space: nowrap;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 11px;
            font-size: .9em;
            font-weight: bold;
            display: inline-block;
            padding: 2px 0;
            border-bottom: 2px solid transparent;
        }
        nav a:hover { color: #e0f2fe; }
        nav a.active { border-bottom-color: #fff; }
        @media (max-width: 600px) { nav a { margin: 0 8px; font-size: .78em; } }

        main { max-width: 1000px; margin: 0 auto; padding: 0 16px 40px; }

        /* HERO WORDS */
        .intro { text-align: center; padding: 48px 8px 28px; }
        .intro h2 {
            font-size: clamp(1.8rem, 6vw, 3.2rem);
            line-height: 1.1;
            color: #1e40af;
            letter-spacing: -.5px;
        }
        .intro .tag {
            margin-top: 14px;
            font-size: clamp(1rem, 3vw, 1.35rem);
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #0ea5e9;
            font-weight: bold;
        }

        /* FULL-WIDTH LOOPING VIDEOS (no controls) */
        .videos {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0;
            width: 100%;
            margin: 10px 0 0;
        }
        .videos video {
            width: 100%;
            height: 78svh;
            object-fit: cover;
            object-position: center;
            display: block;
            background: #dbeafe;
            pointer-events: none;      /* no tap/long-press menus, no controls */
            -webkit-touch-callout: none;
            user-select: none;
        }
        .videos video::-webkit-media-controls,
        .videos video::-webkit-media-controls-start-playback-button { display: none !important; }
        @media (min-width: 900px) {
            .videos { grid-template-columns: 1fr 1fr; }
            .videos video { height: 88vh; }
        }

        /* FULL-WIDTH PHOTO SLIDESHOW */
        .slideshow {
            position: relative;
            width: 100%;
            height: 80svh;
            overflow: hidden;
            background: #0f172a;
            margin: 0;
        }
        @media (min-width: 900px) { .slideshow { height: 92vh; } }
        .slideshow[hidden] { display: none; }
        .slide {
            position: absolute; inset: 0;
            opacity: 0;
            transition: opacity 1s ease;
        }
        .slide.on { opacity: 1; }
        /* blurred copy fills the sides on wide screens */
        .slide::before {
            content: "";
            position: absolute; inset: -30px;
            background-image: var(--img);
            background-size: cover;
            background-position: center;
            filter: blur(26px) brightness(.85);
        }
        .slide img {
            position: relative;
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }
        @media (min-width: 900px) { .slide img { object-fit: contain; } }
        .ss-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 40px; height: 40px; border: none; border-radius: 50%;
            background: rgba(255,255,255,.8); color: #1e40af;
            cursor: pointer; font-size: 15px; z-index: 2;
        }
        .ss-btn.prev { left: 12px; }
        .ss-btn.next { right: 12px; }
        .dots {
            position: absolute; bottom: 14px; left: 0; right: 0;
            display: flex; justify-content: center; gap: 8px; z-index: 2;
        }
        .dots button {
            width: 8px; height: 8px; border-radius: 50%; border: none; padding: 0;
            background: rgba(255,255,255,.55); cursor: pointer;
        }
        .dots button.on { background: #fff; transform: scale(1.3); }

        /* LOCATION */
        .location { text-align: center; padding: 10px 8px 0; }
        .location .pin { font-size: 1.6em; color: #1e40af; margin-bottom: 8px; }
        .location p { font-size: clamp(1rem, 2.6vw, 1.2rem); line-height: 1.6; }
        .location strong { color: #1e40af; }
        .actions { margin-top: 18px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .actions a {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 11px 20px; border-radius: 50px;
            color: #fff; text-decoration: none; font-weight: bold; font-size: .95em;
        }
        .actions .map { background: #1e40af; }
        .actions .wa { background: #25d366; }

        footer { background: #1e40af; color: #fff; text-align: center; padding: 20px; }
        footer p { opacity: .9; }
    </style>
</head>
<body>
    <header>
        <h1>Plugged by Shayo</h1>
    </header>

    <nav aria-label="Main">
        <a href="index.html">Home</a>
        <a href="shop.html" class="active">Shop Tour</a>
    </nav>

    <main>
        <section class="intro">
            <h2>Unique Style For Your<br>Feet and Fits</h2>
            <p class="tag">Wear Your Vibe</p>
        </section>
    </main>

    <!-- Looping videos: full width, no controls -->
    <section class="videos" aria-label="Videos of our shop">
        <video src="media/shop-video-1.mp4" poster="media/shop-video-1.jpg" autoplay muted loop playsinline preload="auto" disablepictureinpicture disableremoteplayback tabindex="-1" aria-hidden="true"></video>
        <video src="media/shop-video-2.mp4" poster="media/shop-video-2.jpg" autoplay muted loop playsinline preload="auto" disablepictureinpicture disableremoteplayback tabindex="-1" aria-hidden="true"></video>
    </section>

    <!-- Shop photos slideshow (photos listed in shop.js) -->
    <section class="slideshow" id="slideshow" aria-label="Photos of our shop" hidden>
        <button type="button" class="ss-btn prev" aria-label="Previous photo"><i class="fas fa-chevron-left"></i></button>
        <button type="button" class="ss-btn next" aria-label="Next photo"><i class="fas fa-chevron-right"></i></button>
        <div class="dots" id="dots"></div>
    </section>

    <main style="padding-top:40px">
        <section class="location">
            <div class="pin"><i class="fas fa-location-dot"></i></div>
            <p>Our location is <strong>Stanbank Building</strong><br>(next to Archives, CBD)<br><strong>Shop 19, 3rd Floor</strong></p>
            <div class="actions">
                <a class="map" href="https://www.google.com/maps/search/?api=1&query=Stanbank+Building+Nairobi+CBD" target="_blank" rel="noopener noreferrer"><i class="fas fa-map-location-dot"></i> Get directions</a>
                <a class="wa" href="https://wa.me/254112958414?text=Hi!%20I%20want%20to%20visit%20your%20shop%20at%20Stanbank%20Building." target="_blank" rel="noopener noreferrer"><i class="fab fa-whatsapp"></i> WhatsApp us</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Plugged by Shayo. All rights reserved.</p>
    </footer>

    <script src="shop.js"></script>
</body>
</html>
